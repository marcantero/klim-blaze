[package]
name = "klim-blaze"
version = "0.1.0"
description = "Minimal, low-footprint configurator for the KLIM Blaze Wireless Gaming Mouse"
authors = ["KLIM Blaze community"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "klim_blaze_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
